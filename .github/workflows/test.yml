name: build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Used by the "release" workflow to publish the tag it just pushed. A tag pushed
  # with the GITHUB_TOKEN does not emit the push event that would start this
  # workflow, but "workflow_dispatch" is the documented exception to that rule
  workflow_dispatch:

env:
  CACHE_VERSION: 1
  PRE_COMMIT_CACHE: ~/.cache/pre-commit

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15-dev']
        os: [ubuntu-latest, windows-latest, macos-latest]
        tox_env: [py-multi]
        include:
          - python: '3.14'
            os: ubuntu-latest
            tox_env: 'lint'
          - python: '3.14'
            os: ubuntu-latest
            tox_env: 'update-readme'
          - python: '3.14'
            os: ubuntu-latest
            tox_env: 'build'
        exclude:
          # macos-14 AKA macos-latest has switched to being an ARM runner, only supporting newer versions of Python
          # https://github.com/actions/setup-python/issues/825#issuecomment-2096792396
          - python: '3.10'
            os: macos-latest

    steps:
    - name: Set git to not change EoL
      if: runner.os == 'Windows'
      run: |
        git config --global core.autocrlf false
    - name: Cache pre-commit packages
      id: cache-pre-commit
      uses: actions/cache@v5
      with:
        path: ${{ env.PRE_COMMIT_CACHE }}
        key: ${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python }}-pre-commit
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
        architecture: 'x64'
        cache: 'pip'
    - name: install dependencies
      run: |
        python -mpip install --progress-bar=off -r test-requirements.txt
        pip --version
        pip list --format=freeze
    - name: Test
      run: tox -e ${{ matrix.tox_env }} -v
    # Publishes both the tags pushed from a checkout, e.g. "bump2version" run in a
    # laptop, and the ones dispatched by the "release" workflow. The latter are not
    # GPG signed since no key is available in the runner.
    # Only the ref is checked, not the event, so the dispatched runs publish too
    - name: Publish package
      if: startsWith(github.ref, 'refs/tags') && contains(matrix.tox_env, 'build')
      run: |
        ls -lah dist/*
        python -m twine upload --verbose -u __token__ -p ${{ secrets.PYPI_API_TOKEN }} --repository-url https://upload.pypi.org/legacy/ dist/*
    #TODO: Add GITHUB_RUN_ID.GITHUB_RUN_ATTEMPT.GITHUB_RUN_NUMBER to bumpversion to avoid duplicating upload versions or even the git sha
    - name: codecov
      if: startsWith(matrix.tox_env, 'py')  # only coveralls in python tests
      uses: codecov/codecov-action@v7
      with:
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
